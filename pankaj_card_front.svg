<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <!-- Dark Executive Obsidian Gradient -->
    <linearGradient id="frontBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Metallic Cyan Accent -->
    <linearGradient id="cyanMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.6)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.5)" />
    </linearGradient>

    <!-- Ambient Illumination -->
    <radialGradient id="cyanGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Base Outer Frame -->
  <rect width="1050" height="600" rx="28" fill="url(#frontBg)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect width="1050" height="600" rx="28" fill="url(#cyanGlow)"/>
  <rect width="1050" height="600" rx="28" fill="url(#purpleGlow)"/>

  <!-- High-Precision Technical Corner Marks -->
  <g stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" fill="none">
    <path d="M 40 60 L 40 40 L 60 40" />
    <path d="M 1010 60 L 1010 40 L 990 40" />
    <path d="M 40 540 L 40 560 L 60 560" />
    <path d="M 1010 540 L 1010 560 L 990 560" />
  </g>

  <!-- Circuit Trace Hairline -->
  <path d="M 65 160 L 420 160 L 450 190 L 985 190" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" fill="none"/>
  <circle cx="450" cy="190" r="3.5" fill="#00f0ff" filter="url(#softGlow)"/>
  <circle cx="985" cy="190" r="3" fill="#00f0ff"/>

  <!-- ================= BRAND HEADER ================= -->
  <g transform="translate(65, 55)">
    <!-- Logo Capsule -->
    <g transform="translate(0, 0)">
      <rect width="78" height="78" rx="18" fill="#04060a" stroke="rgba(0, 240, 255, 0.45)" stroke-width="1.5"/>
      <g transform="translate(39, 48) scale(0.19)">
        <circle cx="10" cy="-20" r="95" fill="#0284c7" opacity="0.3"/>
        <path d="M -120 48 L 105 48 A 48 48 0 0 0 130 -32 A 62 62 0 0 0 20 -115 A 75 75 0 0 0 -105 -48 A 48 48 0 0 0 -120 48 Z" fill="url(#cyanMetallic)"/>
        <g transform="translate(68, -75) rotate(22)"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="#04060a"/></g>
        <g transform="translate(122, -112) rotate(22)"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#00f0ff" stroke="#fff" stroke-width="3"/></g>
      </g>
    </g>

    <!-- Company Name & Pill -->
    <text x="98" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="-0.5">
      PixelTo<tspan fill="#00f0ff">Cloud</tspan> <tspan fill="#94a3b8" font-size="28" font-weight="600">Solutions</tspan>
    </text>

    <!-- Subtitle Badge Capsule -->
    <g transform="translate(98, 54)">
      <rect width="320" height="24" rx="12" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#00f0ff"/>
      <text x="24" y="16.5" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1">COMPLETE SOFTWARE &amp; DIGITAL SERVICES</text>
    </g>
  </g>

  <!-- ================= TAGLINE STRIP ================= -->
  <g transform="translate(65, 212)">
    <rect width="920" height="66" rx="16" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#00f0ff"/>
    <text x="32" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18.5" fill="#f1f5f9" letter-spacing="-0.2">
      “Modern websites, custom software, and digital growth tools”
    </text>
  </g>

  <!-- ================= CONTACT DETAILS GRID ================= -->
  <g transform="translate(65, 305)">
    <!-- Card 1: Phone & WhatsApp -->
    <g transform="translate(0, 0)">
      <rect width="445" height="88" rx="16" fill="rgba(11, 17, 30, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <circle cx="42" cy="44" r="22" fill="rgba(37, 211, 102, 0.15)" stroke="rgba(37, 211, 102, 0.4)" stroke-width="1"/>
      <path d="M 36 36 L 41 36 C 42 36 43 37 43.5 38 L 45 42 C 45.5 43 45 44 44 45 L 43 46 C 44 48 46 50 48 51 L 49 50 C 50 49 51 48.5 52 49 L 56 50.5 C 57 51 57.5 52 57.5 53 L 57.5 57 C 57.5 58 56.5 59 55.5 59 C 43 59 34 50 34 37.5 C 34 36.5 35 35.5 36 36 Z" fill="#25d366" transform="translate(-3, -3) scale(0.9)"/>
      <text x="78" y="34" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">CALL &amp; WHATSAPP (24/7)</text>
      <text x="78" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">+91 82193 52124</text>
    </g>

    <!-- Card 2: Email -->
    <g transform="translate(475, 0)">
      <rect width="445" height="88" rx="16" fill="rgba(11, 17, 30, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <circle cx="42" cy="44" r="22" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1"/>
      <path d="M 33 37 C 33 35.5 34.5 34 36 34 L 54 34 C 55.5 34 57 35.5 57 37 L 57 51 C 57 52.5 55.5 54 54 54 L 36 54 C 34.5 54 33 52.5 33 51 Z M 35 36 L 45 44 L 55 36 Z" fill="#00f0ff" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="78" y="34" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">DIRECT EMAIL</text>
      <text x="78" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="700" fill="#ffffff">pixeltocloud@gmail.com</text>
    </g>

    <!-- Card 3: Website -->
    <g transform="translate(0, 104)">
      <rect width="445" height="88" rx="16" fill="rgba(11, 17, 30, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <circle cx="42" cy="44" r="22" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <circle cx="42" cy="44" r="11" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <path d="M 31 44 L 53 44 M 42 33 C 45 37 46 41 46 44 C 46 47 45 51 42 55 M 42 33 C 39 37 38 41 38 44 C 38 47 39 51 42 55" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <text x="78" y="34" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">OFFICIAL WEBSITE</text>
      <text x="78" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#00f0ff">www.pixeltocloud.com</text>
    </g>

    <!-- Card 4: Location -->
    <g transform="translate(475, 104)">
      <rect width="445" height="88" rx="16" fill="rgba(11, 17, 30, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <circle cx="42" cy="44" r="22" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <path d="M 42 33 C 38 33 35 36 35 40 C 35 45 42 55 42 55 C 42 55 49 45 49 40 C 49 36 46 33 42 33 Z M 42 42 C 40.5 42 39.5 41 39.5 39.5 C 39.5 38 40.5 37 42 37 C 43.5 37 44.5 38 44.5 39.5 C 44.5 41 43.5 42 42 42 Z" fill="#c084fc"/>
      <text x="78" y="34" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">REGISTERED OFFICE</text>
      <text x="78" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="700" fill="#ffffff">Alwar, Rajasthan <tspan fill="#94a3b8" font-size="14" font-weight="500">(Worldwide)</tspan></text>
    </g>
  </g>

  <!-- ================= BOTTOM TRUST STRIP ================= -->
  <g transform="translate(65, 522)">
    <rect width="920" height="42" rx="10" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.18)" stroke-width="1"/>
    <text x="460" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">
      <tspan fill="#10b981">✓</tspan> 100% Code Ownership  ·  <tspan fill="#00f0ff">✓</tspan> Direct Senior Architect Access  ·  <tspan fill="#f59e0b">✓</tspan> Quick Delivery in Days
    </text>
  </g>
</svg>
