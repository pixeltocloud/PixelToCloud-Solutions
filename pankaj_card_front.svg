<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=Fira+Code:wght@500;600;700&amp;display=swap');
      * { box-sizing: border-box; }
    </style>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="pixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- ================= CARD BASE (MINIMALIST STUDIO WHITE) ================= -->
  <rect width="1050" height="600" fill="#ffffff"/>
  
  <!-- Subtle top accent line (Apple style precision hairline) -->
  <rect x="0" y="0" width="1050" height="4" fill="#0284c7"/>

  <!-- Inset Border Guide for Print Precision -->
  <rect x="30" y="30" width="990" height="540" rx="16" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- ================= BRAND HEADER ================= -->
  <g transform="translate(70, 62)">
    <!-- Minimalist Logo Mark -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
      <g transform="translate(36, 44) scale(0.18)">
        <circle cx="10" cy="-20" r="95" fill="#e0f2fe"/>
        <path d="M -120 48 L 105 48 A 48 48 0 0 0 130 -32 A 62 62 0 0 0 20 -115 A 75 75 0 0 0 -105 -48 A 48 48 0 0 0 -120 48 Z" fill="url(#cloudGrad)"/>
        <g transform="translate(68, -75) rotate(22)"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="#f8fafc"/></g>
        <g transform="translate(122, -112) rotate(22)"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="url(#pixelGrad)" stroke="#ffffff" stroke-width="3"/></g>
      </g>
    </g>

    <!-- Company Name -->
    <text x="92" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#0f172a" letter-spacing="-0.5">
      PixelTo<tspan fill="#0284c7">Cloud</tspan> <tspan fill="#64748b" font-size="28" font-weight="600">Solutions</tspan>
    </text>

    <!-- Refined Studio Subtitle -->
    <g transform="translate(94, 50)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0284c7" letter-spacing="1.5">
        CUSTOM SOFTWARE  ·  AI AUTOMATION  ·  CLOUD
      </text>
    </g>
  </g>

  <!-- ================= EDITORIAL VALUE PROPOSITION ================= -->
  <g transform="translate(70, 190)">
    <line x1="0" y1="0" x2="910" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="19" fill="#334155" letter-spacing="-0.2">
      "Modern websites, custom software, and digital growth tools for forward-thinking businesses."
    </text>
  </g>

  <!-- ================= CONTACT TILES GRID ================= -->
  <g transform="translate(70, 275)">
    <!-- Tile 1: Phone & WhatsApp -->
    <g transform="translate(0, 0)">
      <rect width="440" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="42" cy="46" r="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <path d="M 36 38 L 41 38 C 42 38 43 39 43.5 40 L 45 44 C 45.5 45 45 46 44 47 L 43 48 C 44 50 46 52 48 53 L 49 52 C 50 51 51 50.5 52 51 L 56 52.5 C 57 53 57.5 54 57.5 55 L 57.5 59 C 57.5 60 56.5 61 55.5 61 C 43 61 34 52 34 39.5 C 34 38.5 35 37.5 36 38 Z" fill="#059669" transform="translate(-3, -3) scale(0.9)"/>
      <text x="80" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">CALL &amp; WHATSAPP (24/7)</text>
      <text x="80" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="21" font-weight="800" fill="#0f172a">+91 82193 52124</text>
    </g>

    <!-- Tile 2: Business Email -->
    <g transform="translate(470, 0)">
      <rect width="440" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="42" cy="46" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <path d="M 33 39 C 33 37.5 34.5 36 36 36 L 54 36 C 55.5 36 57 37.5 57 39 L 57 53 C 57 54.5 55.5 56 54 56 L 36 56 C 34.5 56 33 54.5 33 53 Z M 35 38 L 45 46 L 55 38 Z" fill="#0284c7" stroke="#0284c7" stroke-width="0.5"/>
      <text x="80" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">DIRECT BUSINESS EMAIL</text>
      <text x="80" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="19.5" font-weight="700" fill="#0f172a">contact@pixeltocloud.com</text>
    </g>

    <!-- Tile 3: Website -->
    <g transform="translate(0, 110)">
      <rect width="440" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="42" cy="46" r="22" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <circle cx="42" cy="46" r="11" stroke="#0284c7" stroke-width="1.6" fill="none"/>
      <path d="M 31 46 L 53 46 M 42 35 C 45 39 46 43 46 46 C 46 49 45 53 42 57 M 42 35 C 39 39 38 43 38 46 C 38 49 39 53 42 57" stroke="#0284c7" stroke-width="1.4" fill="none"/>
      <text x="80" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">OFFICIAL WEBSITE</text>
      <text x="80" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="20.5" font-weight="800" fill="#0284c7">www.pixeltocloud.com</text>
    </g>

    <!-- Tile 4: Location -->
    <g transform="translate(470, 110)">
      <rect width="440" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="42" cy="46" r="22" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1"/>
      <path d="M 42 35 C 38 35 35 38 35 42 C 35 47 42 57 42 57 C 42 57 49 47 49 42 C 49 38 46 35 42 35 Z M 42 44 C 40.5 44 39.5 43 39.5 41.5 C 39.5 40 40.5 39 42 39 C 43.5 39 44.5 40 44.5 41.5 C 44.5 43 43.5 44 42 44 Z" fill="#9333ea"/>
      <text x="80" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">REGISTERED OFFICE</text>
      <text x="80" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="19.5" font-weight="700" fill="#0f172a">Alwar, Rajasthan <tspan fill="#64748b" font-size="14.5" font-weight="500">(Serving Worldwide)</tspan></text>
    </g>
  </g>

  <!-- ================= BOTTOM REFINED TRUST BAR ================= -->
  <g transform="translate(70, 508)">
    <rect width="910" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="455" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.4">
      <tspan fill="#059669">✓</tspan> Full Source-Code Ownership  ·  <tspan fill="#0284c7">✓</tspan> Quick Delivery in Days  ·  <tspan fill="#d97706">✓</tspan> Dedicated Ongoing Support
    </text>
  </g>
</svg>
