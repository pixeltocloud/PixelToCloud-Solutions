<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
    </style>

    <!-- Global High-Fidelity Logo Gradient -->
    <linearGradient id="pCloudGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- CARD BASE (PURE MINIMALIST WHITE) -->
  <rect width="1050" height="600" fill="#ffffff"/>

  <!-- ================= LOGO & BRAND IDENTITY ================= -->
  <g transform="translate(525, 180)">
    <!-- THE EXACT P-CLOUD ICON -->
    <g transform="translate(-124, -80)">
      <!-- Outer Cloud Contour Outline -->
      <path d="M 72 145 
               L 42 145 
               C 16 145, -2 122, -2 92 
               C -2 64, 18 42, 46 40 
               C 58 10, 88 -8, 124 -8 
               C 160 -8, 190 10, 202 40 
               C 230 42, 250 64, 250 92 
               C 250 122, 230 145, 198 145 
               L 128 145"
            fill="none" 
            stroke="url(#pCloudGrad)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Inner Concentric Cloud Arch -->
      <path d="M 66 44 
               C 78 22, 98 12, 124 12 
               C 150 12, 168 22, 180 44"
            fill="none" 
            stroke="url(#pCloudGrad)" 
            stroke-width="13" 
            stroke-linecap="round"/>

      <!-- The Complete Letter P (Continuous Stem + Bowl) -->
      <path d="M 102 145 
               L 102 44 
               L 118 44 
               C 144 44, 154 56, 154 74 
               C 154 92, 142 104, 118 104 
               L 102 104"
            fill="none" 
            stroke="url(#pCloudGrad)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- Company Name Typography (Bold PixelToCloud) -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="48" fill="#0f172a" text-anchor="middle" letter-spacing="-0.8">
      PixelToCloud
    </text>

    <!-- Tagline Subtitle -->
    <text x="0" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18.5" fill="#475569" text-anchor="middle" letter-spacing="0.4">
      Custom Software · AI Automation · Cloud
    </text>
  </g>

  <!-- ================= MINIMALIST 2-ROW CONTACT (NO ADDRESS · ULTRA CLEAN) ================= -->
  <g transform="translate(525, 450)">
    <!-- Row 1: Email & Phone -->
    <g transform="translate(0, 0)">
      <!-- Email -->
      <g transform="translate(-275, 0)">
        <path d="M 0 -8 C 0 -9.5 1 -10.5 2.5 -10.5 L 20.5 -10.5 C 22 -10.5 23 -9.5 23 -8 L 23 5 C 23 6.5 22 7.5 20.5 7.5 L 2.5 7.5 C 1 7.5 0 6.5 0 5 Z M 2 -8 L 11.5 -0.5 L 21 -8 Z" fill="#0f172a"/>
        <text x="34" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">
          contact@pixeltocloud.com
        </text>
      </g>

      <!-- Pipe Separator -->
      <text x="12" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="300" fill="#94a3b8" text-anchor="middle">|</text>

      <!-- Phone -->
      <g transform="translate(38, 0)">
        <text x="0" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="800" fill="#0f172a" text-anchor="start">
          +91 86290 08768
        </text>
      </g>
    </g>

    <!-- Row 2: Website Centered -->
    <g transform="translate(0, 42)">
      <circle cx="-118" cy="-1" r="8.5" stroke="#0f172a" stroke-width="1.5" fill="none"/>
      <path d="M -126.5 -1 L -109.5 -1 M -118 -9.5 C -116 -6.5 -115 -3 -115 -1 C -115 1 -116 4.5 -118 7.5 M -118 -9.5 C -120 -6.5 -121 -3 -121 -1 C -121 1 -120 4.5 -118 7.5" stroke="#0f172a" stroke-width="1.3" fill="none"/>
      <text x="-98" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="start">
        www.pixeltocloud.com
      </text>
    </g>
  </g>
</svg>
