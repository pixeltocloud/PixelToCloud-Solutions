<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>

    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- CARD BASE -->
  <rect width="1050" height="600" fill="#ffffff"/>

  <!-- ================= LOGO & BRAND SECTION ================= -->
  <g transform="translate(525, 185)">
    <!-- P-CLOUD ICON (REFINED ICONIC MONOGRAM) -->
    <g transform="translate(0, -65)">
      <!-- Outer Cloud Contour Outline -->
      <path d="M -30 50 
               L -62 50 
               C -92 50, -116 26, -116 -4 
               C -116 -30, -96 -52, -68 -54 
               C -56 -86, -24 -106, 16 -106 
               C 54 -106, 84 -86, 96 -54 
               C 124 -52, 144 -30, 144 -4 
               C 144 26, 120 50, 90 50 
               L 30 50"
            fill="none" 
            stroke="url(#logoGrad)" 
            stroke-width="17" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Centered Letter 'P' Monogram -->
      <path d="M -6 50 
               L -6 -40 
               L 18 -40 
               C 46 -40, 58 -26, 58 -8 
               C 58 12, 46 24, 18 24 
               L -6 24" 
            fill="none" 
            stroke="url(#logoGrad)" 
            stroke-width="17" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- Brand Typography -->
    <text x="0" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">
      PixelToCloud <tspan fill="#475569" font-weight="600">Solutions</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18.5" fill="#64748b" text-anchor="middle" letter-spacing="0.4">
      Custom Software · AI Automation · Cloud
    </text>
  </g>

  <!-- ================= SUBTLE SEPARATOR ================= -->
  <line x1="280" y1="355" x2="770" y2="355" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- ================= BALANCED CONTACT SECTION ================= -->
  <g transform="translate(525, 412)">
    <!-- Row 1: Email & Phone -->
    <g transform="translate(0, 0)">
      <!-- Email -->
      <g transform="translate(-16, 0)">
        <path d="M -180 -8 C -180 -9.5 -179 -10.5 -177.5 -10.5 L -159.5 -10.5 C -158 -10.5 -157 -9.5 -157 -8 L -157 5 C -157 6.5 -158 7.5 -159.5 7.5 L -177.5 7.5 C -179 7.5 -180 6.5 -180 5 Z M -178 -8 L -168.5 -0.5 L -159 -8 Z" fill="#0284c7"/>
        <text x="-146" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">
          contact@pixeltocloud.com
        </text>
      </g>

      <!-- Pipe -->
      <text x="116" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="300" fill="#cbd5e1" text-anchor="middle">|</text>

      <!-- Phone -->
      <g transform="translate(138, 0)">
        <path d="M 0 -8 C 0 -9 1 -10 2 -10 L 4.5 -10 C 5.5 -10 6.5 -9 6.5 -8 L 7.5 -5 C 8 -4 7.5 -3 6.5 -2 L 6 -1 C 7 1 8.5 2.5 10.5 3.5 L 11.5 3 C 12.5 2 13.5 2.5 14.5 3 L 17.5 4.5 C 18.5 5 18.5 6 17.5 7 L 16.5 8 C 15.5 9 14.5 9 13.5 8 C 5.5 7 0.5 2 0 -6 Z" fill="#16a34a" transform="scale(0.9) translate(0, -2)"/>
        <text x="24" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">
          +91 82193 52124
        </text>
      </g>
    </g>

    <!-- Row 2: Website & Location -->
    <g transform="translate(0, 42)">
      <!-- Website -->
      <g transform="translate(-16, 0)">
        <circle cx="-168" cy="-1" r="8.5" stroke="#0284c7" stroke-width="1.5" fill="none"/>
        <path d="M -176.5 -1 L -159.5 -1 M -168 -9.5 C -166 -6.5 -165 -3 -165 -1 C -165 1 -166 4.5 -168 7.5 M -168 -9.5 C -170 -6.5 -171 -3 -171 -1 C -171 1 -170 4.5 -168 7.5" stroke="#0284c7" stroke-width="1.3" fill="none"/>
        <text x="-146" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0284c7" text-anchor="start">
          www.pixeltocloud.com
        </text>
      </g>

      <!-- Pipe -->
      <text x="116" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="300" fill="#cbd5e1" text-anchor="middle">|</text>

      <!-- Location -->
      <g transform="translate(138, 0)">
        <path d="M 6 -9 C 3 -9 1 -7 1 -4 C 1 0 6 7 6 7 C 6 7 11 0 11 -4 C 11 -7 9 -9 6 -9 Z M 6 -2.5 C 5 -2.5 4.3 -3.2 4.3 -4 C 4.3 -4.8 5 -5.5 6 -5.5 C 7 -5.5 7.7 -4.8 7.7 -4 C 7.7 -3.2 7 -2.5 6 -2.5 Z" fill="#9333ea" transform="scale(1.05) translate(-2, 0)"/>
        <text x="24" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start">
          Alwar, Rajasthan <tspan fill="#94a3b8" font-size="14">(Worldwide)</tspan>
        </text>
      </g>
    </g>

    <!-- Row 3: Trust Footnote -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
        <tspan fill="#059669">✓</tspan> Full Source-Code Ownership  ·  <tspan fill="#0284c7">✓</tspan> Rapid Delivery  ·  <tspan fill="#d97706">✓</tspan> Dedicated Ongoing Support
      </text>
    </g>
  </g>
</svg>
