<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      * { box-sizing: border-box; }
    </style>

    <linearGradient id="cloudStrokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="pGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ================= CARD BASE (PREMIUM MINIMALIST WHITE) ================= -->
  <rect width="1050" height="600" fill="#ffffff"/>

  <!-- ================= CENTERED BRAND & P-CLOUD LOGO ================= -->
  <g transform="translate(525, 145)">
    <!-- Cloud Contour -->
    <path d="M -45 50 
             C -75 50, -95 30, -95 5 
             C -95 -20, -75 -40, -50 -42 
             C -38 -65, -12 -78, 15 -78 
             C 42 -78, 68 -65, 80 -42 
             C 105 -40, 125 -20, 125 5 
             C 125 30, 105 50, 75 50 
             L 0 50"
          fill="none" 
          stroke="url(#cloudStrokeGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Base Left Accent -->
    <path d="M -45 50 L -25 50" 
          fill="none" 
          stroke="url(#cloudStrokeGrad)" 
          stroke-width="15" 
          stroke-linecap="round" />

    <!-- Letter P Monogram (Stem + Bowl) -->
    <path d="M -10 50 L -10 -35 C -10 -35, 34 -35, 34 -6 C 34 22, -10 22, -10 22" 
          fill="none" 
          stroke="url(#pGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Company Name Typography -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">
      PixelToCloud <tspan fill="#475569" font-weight="600">Solutions</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="19" fill="#475569" text-anchor="middle" letter-spacing="0.2">
      Custom Software · AI Automation · Cloud
    </text>
  </g>

  <!-- ================= DIVIDER LINE ================= -->
  <line x1="225" y1="365" x2="825" y2="365" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- ================= CONTACT DETAILS SECTION ================= -->
  <g transform="translate(525, 415)">
    <!-- Row 1: Email & Phone -->
    <g transform="translate(0, 0)">
      <!-- Email -->
      <g transform="translate(-16, 0)">
        <path d="M -175 -8 C -175 -9 -174 -10 -173 -10 L -157 -10 C -156 -10 -155 -9 -155 -8 L -155 4 C -155 5 -156 6 -157 6 L -173 6 C -174 6 -175 5 -175 4 Z M -173 -8 L -165 -1 L -157 -8 Z" fill="#0284c7"/>
        <text x="-145" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="17.5" font-weight="700" fill="#0f172a" text-anchor="start">
          contact@pixeltocloud.com
        </text>
      </g>

      <!-- Separator Pipe -->
      <text x="120" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="300" fill="#cbd5e1" text-anchor="middle">|</text>

      <!-- Phone / WhatsApp -->
      <g transform="translate(138, 0)">
        <path d="M 0 -8 C 0 -9 1 -10 2 -10 L 4 -10 C 5 -10 6 -9 6 -8 L 7 -5 C 7.5 -4 7 -3 6 -2 L 5.5 -1 C 6.5 1 8 2.5 10 3.5 L 11 3 C 12 2 13 2.5 14 3 L 17 4.5 C 18 5 18 6 17 7 L 16 8 C 15 9 14 9 13 8 C 5 7 0 2 0 -6 Z" fill="#16a34a" transform="scale(0.85) translate(0, -2)"/>
        <text x="24" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="17.5" font-weight="700" fill="#0f172a" text-anchor="start">
          +91 82193 52124
        </text>
      </g>
    </g>

    <!-- Row 2: Website & Location -->
    <g transform="translate(0, 36)">
      <!-- Website -->
      <g transform="translate(-16, 0)">
        <circle cx="-165" cy="-2" r="7.5" stroke="#0284c7" stroke-width="1.3" fill="none"/>
        <path d="M -172.5 -2 L -157.5 -2 M -165 -9.5 C -163 -7 -162 -4 -162 -2 C -162 0 -163 3 -165 5.5 M -165 -9.5 C -167 -7 -168 -4 -168 -2 C -168 0 -167 3 -165 5.5" stroke="#0284c7" stroke-width="1.1" fill="none"/>
        <text x="-145" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="17.5" font-weight="800" fill="#0284c7" text-anchor="start">
          www.pixeltocloud.com
        </text>
      </g>

      <!-- Separator Pipe -->
      <text x="120" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="300" fill="#cbd5e1" text-anchor="middle">|</text>

      <!-- Location -->
      <g transform="translate(138, 0)">
        <path d="M 6 -9 C 3 -9 1 -7 1 -4 C 1 0 6 7 6 7 C 6 7 11 0 11 -4 C 11 -7 9 -9 6 -9 Z M 6 -2.5 C 5 -2.5 4.3 -3.2 4.3 -4 C 4.3 -4.8 5 -5.5 6 -5.5 C 7 -5.5 7.7 -4.8 7.7 -4 C 7.7 -3.2 7 -2.5 6 -2.5 Z" fill="#9333ea" transform="translate(-2, 0)"/>
        <text x="24" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start">
          Alwar, Rajasthan <tspan fill="#94a3b8" font-size="14">(Worldwide)</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM SUBTLE TRUST STRIP ================= -->
  <g transform="translate(525, 535)">
    <rect x="-375" y="-18" width="750" height="36" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.3">
      <tspan fill="#059669">✓</tspan> Full Source-Code Ownership  ·  <tspan fill="#0284c7">✓</tspan> Quick Delivery in Days  ·  <tspan fill="#d97706">✓</tspan> Dedicated Long-Term Support
    </text>
  </g>
</svg>
