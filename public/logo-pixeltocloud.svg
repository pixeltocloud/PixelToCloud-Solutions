<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
    </style>

    <linearGradient id="logoIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- P-Cloud Icon Mark -->
  <g transform="translate(145, 115)">
    <!-- Outer Cloud Contour Outline -->
    <path d="M -30 50 
             L -62 50 
             C -92 50, -116 26, -116 -4 
             C -116 -30, -96 -52, -68 -54 
             C -56 -86, -24 -106, 16 -106 
             C 54 -106, 84 -86, 96 -54 
             C 124 -52, 144 -30, 144 -4 
             C 144 26, 120 50, 90 50 
             L 30 50"
          fill="none" 
          stroke="url(#logoIconGrad)" 
          stroke-width="17" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Concentric Arch -->
    <path d="M -34 -44 
             C -24 -68, -4 -82, 18 -82 
             C 40 -82, 60 -68, 70 -44" 
          fill="none" 
          stroke="url(#logoIconGrad)" 
          stroke-width="13" 
          stroke-linecap="round" />

    <!-- The Complete Letter P (Continuous Stem + Bowl) -->
    <path d="M -6 50 
             L -6 -40 
             L 10 -40 
             C 36 -40, 48 -28, 48 -10 
             C 48 8, 36 20, 10 20 
             L -6 20" 
          fill="none" 
          stroke="url(#logoIconGrad)" 
          stroke-width="17" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Brand Typography Lockup -->
  <g transform="translate(300, 120)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="-0.5">
      PixelToCloud
    </text>
    <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="20" fill="#475569" letter-spacing="1">
      SOLUTIONS
    </text>
    <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#0284c7" letter-spacing="0.5">
      Custom Software · AI Automation · Cloud
    </text>
  </g>
</svg>
