<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PixelToCloud Logo">
  <defs>
    <!-- Master Brand Tech Gradient -->
    <linearGradient id="pCloudGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Centered Master P-Cloud Monogram Icon -->
  <g transform="translate(256, 256) scale(1.55) translate(-14, 28)">
    <!-- Outer Cloud Contour Outline -->
    <path d="M -30 50 
             L -62 50 
             C -92 50, -116 26, -116 -4 
             C -116 -30, -96 -52, -68 -54 
             C -56 -86, -24 -106, 16 -106 
             C 54 -106, 84 -86, 96 -54 
             C 124 -52, 144 -30, 144 -4 
             C 144 26, 120 50, 90 50 
             L 30 50"
          fill="none" 
          stroke="url(#pCloudGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Concentric Arch -->
    <path d="M -34 -44 
             C -24 -68, -4 -82, 18 -82 
             C 40 -82, 60 -68, 70 -44" 
          fill="none" 
          stroke="url(#pCloudGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- The Complete Letter P (Continuous Stem + Bowl) -->
    <path d="M -6 50 
             L -6 -40 
             L 10 -40 
             C 36 -40, 48 -28, 48 -10 
             C 48 8, 36 20, 10 20 
             L -6 20" 
          fill="none" 
          stroke="url(#pCloudGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
